name: Framework capability
description: Propose a reusable capability that belongs in the library rather than one application
title: "proposal: "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Oolong grows through complete vertical slices. Describe the application pressure first; an API shape comes after the ownership and layer are clear.

  - type: textarea
    id: use-case
    attributes:
      label: Application use case
      description: Describe the concrete interface and the task it cannot express today.
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Existing composition
      description: Show the closest composition of current core, headless, or kit APIs and where it fails.
    validations:
      required: true

  - type: dropdown
    id: lifetime
    attributes:
      label: Output lifetime
      options:
        - Full-screen root
        - Inline live tail and terminal scrollback
        - Both
        - No rendered output
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: State and ownership
      description: Name the state, who mutates it, when it ends, and which layer can describe it without application vocabulary.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why application code or a smaller composition does not fully meet the requirement.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The proposal contains no product-specific model, command, or workflow grammar.
          required: true
        - label: The lower layer does not need to know an upper-layer type.
          required: true
