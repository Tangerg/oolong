version: 2

# The dependency list is a promise this library makes, and a test fails when it
# grows. That makes an automated bump safe to look at: it can only ever move a
# version, never add a name, because the arch test would refuse the addition.
updates:
  - package-ecosystem: gomod
    # The repository root has no go.mod. Keep every real module in one update
    # declaration and group a shared dependency by name across those modules.
    directories:
      - /components
      - /core
      - /examples
      - /highlight
      - /latex
      - /markdown
      - /ptytest
      - /ssh
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      repository-dependencies:
        group-by: dependency-name
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
