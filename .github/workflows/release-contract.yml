name: release contract

on:
  push:
    tags: ["**/v*"]
  workflow_dispatch:
    inputs:
      module:
        description: Public module to validate before tagging
        required: true
        type: string
      version:
        description: Proposed canonical version, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A tag promises its own module and already-published dependencies. Higher release
# phases may still be unfinished in this snapshot; full workspace CI belongs to main.
jobs:
  module:
    name: published module contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      # scripts/release.sh compares APIs before immutable tags are published.
      # This check validates usability even after the version enters the proxy;
      # gorelease's next-version suggestion is not a post-publication contract.
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260820142414-ca536658362e

      - name: Validate the module and its published dependencies
        shell: bash
        env:
          GOWORK: "off"
          INPUT_MODULE: ${{ inputs.module }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          module="$INPUT_MODULE"
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            module="${GITHUB_REF_NAME%%/v*}"
            version="v${GITHUB_REF_NAME#*/v}"
          fi

          public_modules=$(scripts/modules.sh --public)
          case " ${public_modules//$'\n'/ } " in
            *" $module "*) ;;
            *) echo "unknown public module: $module" >&2; exit 2 ;;
          esac

          cd "$module"
          gorelease -base=none -version="$version"
