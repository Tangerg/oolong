name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A library nobody has touched for a month can still be broken by a new Go
  # release or a dependency's. Finding that out on a schedule is cheaper than
  # finding it out from the first person who tries to use it.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs over every module. `go test ./...` covers the module it is
# standing in and no other, so a workspace has to be walked rather than trusted.
# scripts/modules.sh derives membership from go.work and owns the public subset;
# release and compatibility checks consume those outputs rather than copying them.

jobs:
  test:
    # All three, because the library claims to be portable and a claim nothing
    # checks is a claim that stops being true quietly. Windows observes resize by
    # polling rather than SIGWINCH and has no pty here; both source paths still need
    # to build and their deterministic contracts still need to run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The language floor and the current patch release. The first catches an
        # accidental dependency on a later point release; the second catches changes
        # in the toolchain itself.
        go: ["1.27.0", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          # The repository root is a workspace, not a module. This glob follows
          # every module with dependencies without another hand-maintained list.
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Built into a scratch directory rather than in place: a module whose
      # only package is a command in a directory of the same name would
      # otherwise try to write the binary over that directory.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do
            (
              cd "$m"
              # A module holding a command builds into a scratch directory: the
              # binary would otherwise be written next to, and over, the directory
              # it was built from.
              package_names=$(go list -f '{{.Name}}' ./...)
              if grep -qx main <<<"$package_names"; then
                go build -o "$RUNNER_TEMP/build/" ./...
              else
                go build ./...
              fi
            ) || exit 1
          done

      - name: Vet
        shell: bash
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do (cd "$m" && go vet ./...); done

      # The race detector is the point of running the tests at all: the whole
      # concurrency model is "one goroutine owns the state", and the only way
      # that stays true is if something checks.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do (cd "$m" && go test -race -count=1 ./...); done

  mermaid-backend:
    name: Mermaid native backend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the official CLI and browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mermaid" --no-audit --no-fund --save-exact @mermaid-js/mermaid-cli@11.17.0
          cli="$RUNNER_TEMP/mermaid/node_modules/.bin/mmdc"
          if [[ "$RUNNER_OS" == Windows ]]; then cli="$cli.cmd"; fi
          echo "OOLONG_MERMAID_CLI=$cli" >> "$GITHUB_ENV"
      - name: Test rendering, cancellation and process ownership
        shell: bash
        run: go -C mermaid test -race -v -count=1 ./...

  standalone:
    name: modules without workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      # A workspace can make an undeclared local dependency look healthy. Work in a
      # disposable checkout with the workspace off and local versions of declared
      # Oolong dependencies. A replacement does not add a requirement, so an
      # undeclared dependency still fails; a coordinated unreleased change can be
      # checked before its lower module has a tag.
      - name: Test each module with GOWORK off
        shell: bash
        run: |
          set -euo pipefail
          standalone_root="$RUNNER_TEMP/oolong-standalone"
          cp -R . "$standalone_root"
          modules=$(scripts/modules.sh)
          for m in $modules; do
            (
              cd "$standalone_root/$m"
              "$standalone_root/scripts/replace-local-modules.sh" "$standalone_root"
              GOWORK=off go test -count=1 ./...
            )
          done

  floor:
    name: Go 1.27 module floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false
      - name: Test declared floor on every supported source set
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          set -euo pipefail
          # Every module makes the same language promise. Test each without go.work
          # so one cannot borrow that promise from the repository root. A replacement
          # does not add a requirement: undeclared imports still fail while coordinated
          # unreleased dependencies resolve to this checkout.
          modules=$(scripts/modules.sh)
          for module in $modules; do
            (
              cd "$module"
              "$GITHUB_WORKSPACE/scripts/replace-local-modules.sh" "$GITHUB_WORKSPACE"
              go test -count=1 ./...
              for os in windows darwin; do
                GOOS="$os" CGO_ENABLED=0 \
                  go test -run '^$' -exec /usr/bin/true ./...
              done
            )
          done

  quality:
    name: lint and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # API-removal evidence is compared with the preceding immutable module
          # tags, not with an arbitrary parent commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      # Pinned rather than floating: a linter that changes under a repository is
      # one whose findings arrive as unrelated failures on somebody else's change.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      # Once per platform, because a linter only sees the files that build for the
      # one it is standing on. A shadowed variable in a Linux-only test file was
      # invisible on a macOS run, which is how it reached main.
      - name: golangci-lint
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for os in linux darwin windows; do
            for m in $modules; do
              (cd "$m" && GOOS=$os golangci-lint run ./...) || exit 1
            done
          done

      # Reachability finds dead private implementation and public contracts without
      # executable caller-side coverage. An unused export is not dead library API:
      # whether it belongs is an API-design decision, never a repository call count.
      - run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - name: callable code reachability
        run: scripts/check-reachability.sh

      # Reachability cannot decide whether a library API deserves removal or a new
      # shape. apidiff supplies the published-symbol ledger; the changelog must name
      # each incompatible change before review or release can proceed.
      - run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260820142414-ca536658362e
      - name: breaking APIs have migration entries
        run: |
          set -euo pipefail
          section=$(sh scripts/ledger-section.sh)
          go -C internal run ./cmd/apiledger -root .. -section "$section"

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do (cd "$m" && govulncheck ./...); done

  # The committed seed corpus runs as part of `go test`, which only replays inputs
  # somebody already found; internal/arch also proves every corpus directory still
  # names a live fuzz target. The bug that made this job exist — a parser whose
  # answer depended on where the read split — passed every other check here and was
  # reached by a fuzzer in fifteen seconds, so the generator runs on every push and
  # not only when someone remembers.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Fuzz every target
        run: |
          set -euo pipefail
          grep -rl '^func Fuzz' --include='*_test.go' . | while read -r file; do
            package="./$(dirname "$file")"
            module="$(cd "$(dirname "$file")" && git rev-parse --show-prefix | cut -d/ -f1)"
            grep -o '^func Fuzz[A-Za-z0-9_]*' "$file" | cut -d' ' -f2 | while read -r target; do
              echo "::group::$file $target"
              (cd "$(dirname "$file")" && go test . -run '^$' -fuzz "^${target}\$" -fuzztime=30s)
              echo "::endgroup::"
            done
          done

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  tidy:
    name: formatting and modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      # gofumpt rather than gofmt: it is gofmt plus the decisions gofmt left open,
      # and a repository that argues about them in review is one that has not made
      # them.
      # The latest tagged gofumpt predates Go 1.27 method syntax. Pin the first
      # upstream revision that parses it; do not float on master.
      - run: go install mvdan.cc/gofumpt@v0.11.1-0.20260820074422-a2bc6805583d
      - name: gofumpt
        run: |
          set -euo pipefail
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofumpt'd:"
            echo "$unformatted"
            exit 1
          fi

      # These scripts define the module set and the only release path. Their format
      # is executable repository policy, so it gets the same pinned, mechanical
      # check as Go source instead of relying on review.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
      - name: shfmt
        run: shfmt -d scripts

      # Each module's go.mod is part of its dependency promise. Use a disposable
      # checkout with local replacements because a coordinated, unreleased change
      # may consume a package that does not exist in the previous published tag.
      # The replacements are added before the comparison, so tidy still reports any
      # drift in requirements, sums or Go versions without polluting published mods.
      - name: go mod tidy is a no-op everywhere
        shell: bash
        run: |
          set -euo pipefail
          tidy_root="$RUNNER_TEMP/oolong-tidy"
          cp -R . "$tidy_root"
          modules=$(scripts/modules.sh)
          for m in $modules; do
            (
              cd "$tidy_root/$m"
              "$tidy_root/scripts/replace-local-modules.sh" "$tidy_root"
              # A local replacement legitimately needs no checksum for the published
              # module it replaces. Normalize only those lines before comparing.
              if [ -f go.sum ]; then
                sed -i.bak '\#^github.com/Tangerg/oolong/#d' go.sum
                rm go.sum.bak
              fi
              GOWORK=off go mod tidy -diff
            )
          done

      # A workspace that has fallen out of step with the modules in it is a
      # checkout that builds for the person who wrote it and nobody else.
      - name: go work sync is a no-op
        run: |
          go work sync
          if ! git diff --quiet -- go.work; then
            echo "go work sync changed go.work:"
            git diff -- go.work
            exit 1
          fi

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          # These are source-portability contracts, not claims that Oolong owns
          # a browser or WASI terminal adapter. Vet includes target-specific test
          # sources; build proves every library package remains consumable there.
          - goos: wasip1
            goarch: wasm
          - goos: js
            goarch: wasm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      # Vet rather than build, because vet type-checks the tests too. A test file
      # that named a syscall package with no build tag on it compiled here and
      # failed on Windows, and a build-only check could not see it: the tests are
      # where the platform-specific code in this repository actually lives.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do (cd "$m" && go vet ./...); done

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          modules=$(scripts/modules.sh)
          for m in $modules; do
            (
              cd "$m"
              # A module holding a command builds into a scratch directory: the
              # binary would otherwise be written next to, and over, the directory
              # it was built from.
              package_names=$(go list -f '{{.Name}}' ./...)
              if grep -qx main <<<"$package_names"; then
                go build -o "$RUNNER_TEMP/cross/" ./...
              else
                go build ./...
              fi
            ) || exit 1
          done
