name: ci

on:
  push:
    branches: [main]
    tags:
      - "core/v*"
      - "components/v*"
      - "markdown/v*"
      - "highlight/v*"
      - "latex/v*"
      - "ptytest/v*"
      - "ssh/v*"
  pull_request:
  workflow_dispatch:
    inputs:
      module:
        description: Public module to validate before tagging
        required: true
        type: choice
        options: [core, components, markdown, highlight, latex, ptytest, ssh]
      version:
        description: Proposed canonical version, for example v1.2.3
        required: true
        type: string
  # A library nobody has touched for a month can still be broken by a new Go
  # release or a dependency's. Finding that out on a schedule is cheaper than
  # finding it out from the first person who tries to use it.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs over every module. `go test ./...` covers the module it is
# standing in and no other, so a workspace has to be walked rather than trusted.
# scripts/modules.sh derives membership from go.work; the release script consumes
# the same list, so adding a module cannot update one gate and silently miss another.

jobs:
  test:
    # All three, because the library claims to be portable and a claim nothing
    # checks is a claim that stops being true quietly. Windows observes resize by
    # polling rather than SIGWINCH and has no pty here; both source paths still need
    # to build and their deterministic contracts still need to run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The workspace floor and the current patch release. Modules with a lower
        # declared floor are exercised separately, without this workspace.
        go: ["1.26.0", "1.26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # Built into a scratch directory rather than in place: a module whose
      # only package is a command in a directory of the same name would
      # otherwise try to write the binary over that directory.
      - name: Build
        shell: bash
        run: |
          for m in $(scripts/modules.sh); do
            (
              cd "$m"
              # A module holding a command builds into a scratch directory: the
              # binary would otherwise be written next to, and over, the directory
              # it was built from.
              if go list -f '{{.Name}}' ./... | grep -qx main; then
                go build -o "$RUNNER_TEMP/build/" ./...
              else
                go build ./...
              fi
            ) || exit 1
          done

      - name: Vet
        shell: bash
        run: for m in $(scripts/modules.sh); do (cd "$m" && go vet ./...) || exit 1; done

      # The race detector is the point of running the tests at all: the whole
      # concurrency model is "one goroutine owns the state", and the only way
      # that stays true is if something checks.
      - name: Test
        shell: bash
        run: for m in $(scripts/modules.sh); do (cd "$m" && go test -race -count=1 ./...) || exit 1; done

  standalone:
    name: modules without workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # A workspace can make an undeclared local dependency look healthy. Work in a
      # disposable checkout with the workspace off and local versions of declared
      # Oolong dependencies. A replacement does not add a requirement, so an
      # undeclared dependency still fails; a coordinated unreleased change can be
      # checked before its lower module has a tag.
      - name: Test each module with GOWORK off
        shell: bash
        run: |
          set -euo pipefail
          standalone_root="$RUNNER_TEMP/oolong-standalone"
          cp -R . "$standalone_root"
          for m in $(scripts/modules.sh); do
            (
              cd "$standalone_root/$m"
              "$standalone_root/scripts/replace-local-modules.sh" "$standalone_root"
              GOWORK=off go test -count=1 ./...
            )
          done

  compatibility:
    name: public API release contract
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A release-tag check compares with the preceding immutable module tag.
          # A shallow checkout cannot know which tag that is.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # gorelease owns both halves of this promise: exported Go API compatibility
      # and the module/dependency facts that make a release usable. Pinning the
      # x/exp revision keeps that interpretation from changing under an unrelated
      # pull request.
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743

      - name: Compare the proposed module with its released baseline
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          module="${{ inputs.module }}"
          version="${{ inputs.version }}"
          current_tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            module="${GITHUB_REF_NAME%%/v*}"
            version="v${GITHUB_REF_NAME#*/v}"
            current_tag="$GITHUB_REF_NAME"
          fi

          case " $(scripts/modules.sh --public | tr '\n' ' ') " in
            *" $module "*) ;;
            *) echo "unknown public module: $module" >&2; exit 2 ;;
          esac

          previous=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$current_tag" ]]; then
              continue
            fi
            previous="$candidate"
            break
          done < <(git tag --list "$module/v*" --sort=-v:refname)
          base=none
          if [[ -n "$previous" ]]; then
            base="v${previous#*/v}"
          fi

          cd "$module"
          # Major zero is the explicitly unstable development period: report
          # every API change, but do not pretend patch-number compatibility is
          # promised. From v1 onward the proposed tag must satisfy Go's
          # compatibility rules against the preceding immutable release.
          if [[ "$version" == v0.* ]]; then
            # With no baseline gorelease validates the proposed canonical version
            # without applying stable-series compatibility policy.
            gorelease -base=none -version="$version" >/dev/null
            gorelease -base="$base"
          else
            gorelease -base="$base" -version="$version"
          fi

  floor:
    name: Go 1.25 floor
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # These modules either have no dependency on an older Oolong tag whose own
        # go.mod still declares 1.26, or are the not-yet-released SSH module checked
        # against the coordinated local core below.
        module: [core, internal, ptytest, ssh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: false
      - name: Test declared floor on every supported source set
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          # A replacement does not add a requirement. Give every downstream floor
          # module the current core when it has declared one, so coordinated
          # breaking changes are tested before their dependency can be tagged; an
          # undeclared import still fails. Keeping this rule general avoids making
          # the first downstream module to consume a new core API a CI special case.
          if [ "${{ matrix.module }}" != core ]; then
            go mod edit -replace=github.com/Tangerg/oolong/core=../core
          fi
          go test -count=1 ./...
          for os in windows darwin; do
            GOOS="$os" CGO_ENABLED=0 \
              go test -run '^$' -exec /usr/bin/true ./...
          done

  quality:
    name: lint and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # Pinned rather than floating: a linter that changes under a repository is
      # one whose findings arrive as unrelated failures on somebody else's change.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # Once per platform, because a linter only sees the files that build for the
      # one it is standing on. A shadowed variable in a Linux-only test file was
      # invisible on a macOS run, which is how it reached main.
      - name: golangci-lint
        run: |
          for os in linux darwin windows; do
            for m in $(scripts/modules.sh); do
              (cd "$m" && GOOS=$os golangci-lint run ./...) || exit 1
            done
          done

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: for m in $(scripts/modules.sh); do (cd "$m" && govulncheck ./...) || exit 1; done

  # The committed seed corpus runs as part of `go test`, which only replays inputs
  # somebody already found. The bug that made this job exist — a parser whose
  # answer depended on where the read split — passed every other check here and
  # was reached by a fuzzer in fifteen seconds, so the generator runs on every
  # push and not only when someone remembers.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Fuzz every target
        run: |
          set -euo pipefail
          grep -rl '^func Fuzz' --include='*_test.go' . | while read -r file; do
            package="./$(dirname "$file")"
            module="$(cd "$(dirname "$file")" && git rev-parse --show-prefix | cut -d/ -f1)"
            grep -o '^func Fuzz[A-Za-z0-9_]*' "$file" | cut -d' ' -f2 | while read -r target; do
              echo "::group::$file $target"
              (cd "$(dirname "$file")" && go test . -run '^$' -fuzz "^${target}\$" -fuzztime=30s)
              echo "::endgroup::"
            done
          done

  docs:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2@0.23.2

  tidy:
    name: formatting and modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # gofumpt rather than gofmt: it is gofmt plus the decisions gofmt left open,
      # and a repository that argues about them in review is one that has not made
      # them.
      - run: go install mvdan.cc/gofumpt@v0.11.0
      - name: gofumpt
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofumpt'd:"
            echo "$unformatted"
            exit 1
          fi

      # These scripts define the module set and the only release path. Their format
      # is executable repository policy, so it gets the same pinned, mechanical
      # check as Go source instead of relying on review.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
      - name: shfmt
        run: shfmt -d scripts

      # Each module's go.mod is part of its dependency promise. Use a disposable
      # checkout with local replacements because a coordinated, unreleased change
      # may consume a package that does not exist in the previous published tag.
      # The replacements are added before the comparison, so tidy still reports any
      # drift in requirements, sums or Go versions without polluting published mods.
      - name: go mod tidy is a no-op everywhere
        shell: bash
        run: |
          set -euo pipefail
          tidy_root="$RUNNER_TEMP/oolong-tidy"
          cp -R . "$tidy_root"
          for m in $(scripts/modules.sh); do
            (
              cd "$tidy_root/$m"
              "$tidy_root/scripts/replace-local-modules.sh" "$tidy_root"
              # A local replacement legitimately needs no checksum for the published
              # module it replaces. Normalize only those lines before comparing.
              if [ -f go.sum ]; then
                sed -i.bak '\#^github.com/Tangerg/oolong/#d' go.sum
                rm go.sum.bak
              fi
              GOWORK=off go mod tidy -diff
            )
          done

      # A workspace that has fallen out of step with the modules in it is a
      # checkout that builds for the person who wrote it and nobody else.
      - name: go work sync is a no-op
        run: |
          go work sync
          if ! git diff --quiet -- go.work; then
            echo "go work sync changed go.work:"
            git diff -- go.work
            exit 1
          fi

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # Vet rather than build, because vet type-checks the tests too. A test file
      # that named a syscall package with no build tag on it compiled here and
      # failed on Windows, and a build-only check could not see it: the tests are
      # where the platform-specific code in this repository actually lives.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: for m in $(scripts/modules.sh); do (cd "$m" && go vet ./...) || exit 1; done

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in $(scripts/modules.sh); do
            (
              cd "$m"
              # A module holding a command builds into a scratch directory: the
              # binary would otherwise be written next to, and over, the directory
              # it was built from.
              if go list -f '{{.Name}}' ./... | grep -qx main; then
                go build -o "$RUNNER_TEMP/cross/" ./...
              else
                go build ./...
              fi
            ) || exit 1
          done
